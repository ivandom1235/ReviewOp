name: ci

on:
  push:
  pull_request:

jobs:
  backend-and-protonet:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Run dataset builder tests
        run: python -m pytest dataset_builder\test_dataset_hardening.py -q
      - name: Run protonet tests
        run: python -m pytest protonet\test_schema_alignment.py protonet\test_safe_bundle.py protonet\test_research_report.py -q
      - name: Run backend tests
        run: python -m pytest backend\test_selective_routing.py backend\test_graph_refresh.py backend\test_hybrid_persistence.py backend\test_explicit_runtime_persistence.py backend\test_bootstrap_schema_patches.py -q
      - name: Compile Python modules
        run: python -m compileall dataset_builder protonet backend
      - name: Build frontend
        run: npm --prefix frontend run build
